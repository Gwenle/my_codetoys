name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64  # 指定目标架构为64位

    - name: Compile single file with cl.exe
      run: |
        cl.exe /EHsc /Fe: main.exe Tetris.cpp /link user32.lib gdi32.lib kernel32.lib

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: my-application
        path: main.exe
